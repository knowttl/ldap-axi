no_ci: true
commands:
  test: npm test
  lint: npm run lint
review:
  path_instructions:
    - path: "**"
      instructions: |
        Test quality: apply the "Test quality" rules in CONTRIBUTING.md to every added or changed test. Flag each violation as a finding naming the rule number, the test file:line and the evidence. Respect the listed exemptions. Never ask for a test to be written first or only to raise coverage.
    - path: "**"
      instructions: |
        Validation must stay offline and use only the offline suite and fixtures.
        Never start, install, provision, or connect to any directory, LDAP, Active Directory, or Samba service, including test:local-directory, containers, or local daemons.
        Report scenarios that need a live directory as untested rather than standing one up.
test:
  instructions: |
    Validation must stay offline and use only the offline suite and fixtures.
    Never start, install, provision, or connect to any directory, LDAP, Active Directory, or Samba service, including test:local-directory, containers, or local daemons.
    Report scenarios that need a live directory as untested rather than standing one up.
document:
  instructions: |
    Validation must stay offline and use only the offline suite and fixtures.
    Never start, install, provision, or connect to any directory, LDAP, Active Directory, or Samba service, including test:local-directory, containers, or local daemons.
    Report scenarios that need a live directory as untested rather than standing one up.
