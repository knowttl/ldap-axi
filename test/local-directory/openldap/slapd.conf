include /etc/openldap/schema/core.schema
include /etc/openldap/schema/cosine.schema
include /etc/openldap/schema/inetorgperson.schema
include /etc/openldap/schema/nis.schema
modulepath /usr/lib/openldap
moduleload back_mdb.so
moduleload memberof.so
moduleload refint.so
moduleload ppolicy.so
pidfile /run/openldap/slapd.pid
argsfile /run/openldap/slapd.args
TLSCACertificateFile /data/tls/ca.crt
TLSCertificateFile /data/tls/server.crt
TLSCertificateKeyFile /data/tls/server.key
sasl-host localhost
sasl-realm LDAPAXI.TEST
authz-regexp "uid=([^,/]+)(,cn=ldapaxi.test)?,cn=gssapi,cn=auth" "uid=$1,ou=people,dc=ldapaxi,dc=test"
access to dn.base="" by * read
access to dn.base="cn=Subschema" by * read
database mdb
maxsize 104857600
suffix "dc=ldapaxi,dc=test"
rootdn "cn=admin,dc=ldapaxi,dc=test"
include /data/rootpw.conf
directory /data/ldap
index objectClass,uid,cn,member,uniqueMember,memberUid eq
access to attrs=userPassword
  by self =xw
  by anonymous auth
  by * none
access to * by users read by * none
overlay memberof
memberof-group-oc groupOfNames
memberof-member-ad member
memberof-memberof-ad memberOf
memberof-refint TRUE
overlay refint
refint_attributes member memberOf
overlay ppolicy
