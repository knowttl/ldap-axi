[kdcdefaults]
  kdc_ports = 88
  kdc_tcp_ports = 88
[realms]
  LDAPAXI.TEST = {
    database_name = /data/krb/principal
    key_stash_file = /data/krb/stash
    acl_file = /data/krb/kadm5.acl
    supported_enctypes = aes256-cts-hmac-sha1-96:normal aes128-cts-hmac-sha1-96:normal
  }
[logging]
  kdc = STDERR
